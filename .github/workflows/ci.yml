name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    # Throwaway credentials for the service containers below. They are not real secrets.
    env:
      APP_NAME: Financial Research Copilot
      ENVIRONMENT: ci
      DATABASE_URL: postgresql+psycopg://fincopilot:ci_password@localhost:5432/fincopilot
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: ci-throwaway-secret-not-a-real-key
      TEST_DATABASE_URL: postgresql+psycopg://fincopilot:ci_password@localhost:5432/fincopilot_test

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: fincopilot
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: fincopilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fincopilot -d fincopilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Run tests
        run: pytest
